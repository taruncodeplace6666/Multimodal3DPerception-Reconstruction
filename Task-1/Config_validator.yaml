
# Task 1A – Projection Accuracy Validator  |  Configuration


#  Dataset Paths 
dataset:
  basedir: "./data"          # Root directory of KITTI raw data
  date: "2011_09_26"         # Recording date (YYYY_MM_DD)
  drive: "0023"              # Drive sequence ID (4-digit string)

# Processing Settings 
processing:
  num_frames: 10             # Number of consecutive frames to validate
  max_dist: 50.0             # Max depth in metres (colour normalisation)
  threshold_px: 3.0          # Alignment error threshold in pixels (rubric limit)

#  Boundary Filter Settings 
boundary_filter:
  disc_thresh: 2.0           # Depth jump (metres) that defines an object edge
  k_neighbours: 12           # Number of projected neighbours to consider
  max_edge_dist: 3.0         # Max px distance from edge for a point to be tested

#  Output Settings 
output:
  output_dir: "./task1_output"   # Directory for annotated frames and report