common:
  lidar_type: 2
  img_topic: "/kitti/camera_color_left/image_raw"
  lid_topic: "/kitti/velo/pointcloud_fixed"
  imu_topic: "/kitti/oxts/imu"
  img_en: 1
  lidar_en: 1
  ros_driver_bug_fix: true
  imu_lidar_sync_tolerance: 0.1

extrin_calib:
  # IMU → LiDAR extrinsics (from calib_imu_to_velo.txt)
  extrinsic_T: [-0.8086759, 0.3195559, -0.7997231]
  extrinsic_R: [ 9.999976e-01,  7.553071e-04, -2.035826e-03,
                -7.854027e-04,  9.998898e-01, -1.482298e-02,
                 2.024406e-03,  1.482454e-02,  9.998881e-01]

  # cam02_rect → LiDAR extrinsics (corrected)
  # Computed from: inv(R_rect_00 @ R_velo_to_cam0)  +  baseline shift
  Rcl: [ 2.34773698e-04,  1.04494074e-02,  9.99945389e-01,
        -9.99944155e-01,  1.05653536e-02,  1.24365378e-04,
        -1.05634778e-02, -9.99889574e-01,  1.04513030e-02]
  Pcl: [ 0.27288884,  0.06019627, -0.07162918]

time_offset:
  imu_time_offset: 0.0
  img_time_offset: 0.0
  exposure_time_init: 0.0

preprocess:
  point_filter_num: 1
  filter_size_surf: 0.3
  lidar_type: 2
  scan_line: 64
  blind: 0.5

vio:
  max_iterations: 5
  outlier_threshold: 1000
  img_point_cov: 100
  patch_size: 8
  patch_pyrimid_level: 4
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1

imu:
  imu_en: true
  imu_int_frame: 30
  acc_cov: 0.1
  gyr_cov: 0.05
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001

lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.005
  voxel_size: 0.3
  max_layer: 3
  max_points_num: 30
  layer_init_num: [5, 5, 5, 5, 5]

local_map:
  map_sliding_en: true
  half_map_size: 75
  sliding_thresh: 6

uav:
  imu_rate_odom: false
  gravity_align_en: false

publish:
  dense_map_en: false
  pub_effect_point_en: false
  pub_plane_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.0

evo:
  seq_name: "KITTI_0023"
  pose_output_en: true

pcd_save:
  pcd_save_en: false
  type: 0
  colmap_output_en: false
  filter_size_pcd: 0.15
  interval: -1

image_save:
  img_save_en: true
  interval: 1
