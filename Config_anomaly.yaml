
# Task 1B – Anomaly Detection & Dynamic Calibration Recovery


#  Dataset Paths 
dataset:
  basedir: "./data"          # Root directory of KITTI raw data
  date: "2011_09_26"         # Recording date (YYYY_MM_DD)
  drive: "0023"              # Drive sequence ID (4-digit string)

# Processing Settings
processing:
  num_frames: 10             # Number of consecutive frames to process
  max_dist: 50.0             # Max depth in metres (colour normalisation)

# Anomaly Detection Thresholds 
detection:
  min_proj_ratio: 0.03       # Flag if < 3% of raw scan projects into image
  max_centroid_shift: 40.0   # Flag if mean (u,v) shifts > this many px from baseline
  max_kl_div: 0.40           # Flag if depth histogram KL divergence exceeds this
  max_edge_p95: 3.0          # Flag if 95th-pct distance to nearest edge exceeds this (px)

# Calibration Recovery 
recovery:
  buffer_size: 5             # Number of recent clean frames to keep for median recovery

# Anomaly Injection (for testing 100% detection) 
injection:
  anomaly_frames: [3, 7]     # Frame indices to inject synthetic yaw error
  yaw_error_rad: 0.15        # Yaw rotation error in radians (~8.6 degrees)

# Output Settings 
output:
  output_dir: "./task1_output"   # Directory for annotated frames and report